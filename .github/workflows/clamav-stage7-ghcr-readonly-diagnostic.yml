name: ClamAV Stage 7 GHCR Read-only Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/clamav-stage7-private-ghcr.yml
      - .github/workflows/clamav-stage7-ghcr-readonly-diagnostic.yml
      - scripts/experiments/verify-ghcr-package-metadata.mjs
      - test/clamav-stage7-ghcr-preflight.test.mjs
      - test/clamav-stage7-ghcr-consistency.test.mjs

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    name: Sanitize package metadata and verify read-only digest access
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_NAME: ghcr.io/mansour1414/dip-clamav
      EXPECTED_REPOSITORY: mansour1414/DIP-Document-Intelligence-Platform
      EXPECTED_PACKAGE_OWNER: mansour1414
      EXPECTED_PACKAGE_NAME: dip-clamav
      EXPECTED_PACKAGE_TYPE: container
      GHCR_VERIFY_PHASE: diagnostic
      GHCR_VERIFY_DIGEST: sha256:a3927e07032824899944ea42d42848482a917a1cb9326a229b55eddff9329b7a
      GHCR_EXPECTED_SOURCE: https://github.com/mansour1414/DIP-Document-Intelligence-Platform
      GHCR_EXPECTED_REVISION: 5eae943518c4d504dc30b323c040b325a216815e
      GHCR_EXPECTED_RUN_ID: "37934221552"
      GHCR_EXPECTED_VERSION: stage7-arm64-candidate-run-37934221552
      GHCR_VERIFY_MAX_ATTEMPTS: "3"
      GHCR_VERIFY_RETRY_SECONDS: "5"
      EVIDENCE_DIR: ${{ github.workspace }}/output/ghcr-readonly-diagnostic

    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx for read-only manifest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR with the repository token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record sanitized package metadata and verify immutable read access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/experiments/verify-ghcr-package-metadata.mjs

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clamav-stage7-ghcr-readonly-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

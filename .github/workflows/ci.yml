name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Bootstrap database roles
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Reconcile runtime grants
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Configure ephemeral runtime role
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_test_runtime'"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Verify application dependencies are ready
        run: node scripts/wait-for-dependencies.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          REDIS_URL: redis://localhost:6379
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          REDIS_URL: redis://localhost:6379
          DIP_RLS_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          DIP_RLS_TEST_DATABASE_URL: postgresql://dip_app:dip_test_runtime@localhost:5432/dip_test

  processing-integration:
    name: Integration / Processing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_processing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx prisma generate
      - run: sudo apt-get update
      - name: Install LibreOffice, Tesseract and fonts
        run: sudo apt-get install --no-install-recommends -y libreoffice-writer libreoffice-calc libreoffice-impress tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-noto-core
      - name: Install corpus and Ghostscript-free OCR dependencies
        run: python -m pip install python-docx openpyxl python-pptx pillow "ocrmypdf==17.10.0" pypdfium2
      - name: Verify Ghostscript is not in the OCR test image
        run: test -z "$(command -v gs || true)"
      - name: Generate safe processing corpus
        run: python scripts/generate-processing-corpus.py
      - name: Start local S3-compatible storage
        run: docker run --detach --name dip-minio --publish 9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
      - name: Wait for object storage readiness
        run: for i in {1..30}; do curl --fail --silent http://localhost:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - name: Create isolated test bucket
        run: node scripts/ensure-test-bucket.mjs
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dip-test
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
      - name: Bootstrap database roles
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Replay migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Reconcile runtime grants
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Configure ephemeral runtime role
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_processing_runtime'"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Verify application dependencies are ready
        run: node scripts/wait-for-dependencies.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          REDIS_URL: redis://localhost:6379
      - name: Run real processing integrations
        run: npm test
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dip-test
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          REDIS_URL: redis://localhost:6379
          DIP_RLS_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          DIP_RLS_TEST_DATABASE_URL: postgresql://dip_app:dip_processing_runtime@localhost:5432/dip_processing
          RUN_STORAGE_E2E: "1"
          RUN_PROCESSING_CORPUS: "1"
          FULL_PROCESSING_E2E: "1"
          REDIS_E2E: "1"

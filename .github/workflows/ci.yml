name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Bootstrap database roles
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Reconcile runtime grants
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Configure ephemeral runtime role
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_test_runtime'; ALTER ROLE dip_retention PASSWORD 'dip_test_retention'"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
      - name: Verify application dependencies are ready
        run: node scripts/wait-for-dependencies.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          REDIS_URL: redis://localhost:6379
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          REDIS_URL: redis://localhost:6379
          DIP_RLS_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/dip_test
          DIP_RLS_TEST_DATABASE_URL: postgresql://dip_app:dip_test_runtime@localhost:5432/dip_test
          DIP_RETENTION_TEST_DATABASE_URL: postgresql://dip_retention:dip_test_retention@localhost:5432/dip_test

  processing-integration:
    name: Integration / Processing
    runs-on: ubuntu-latest
    env:
      CLAMD_HOST: 127.0.0.1
      CLAMD_PORT: "3310"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_processing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx prisma generate
      - run: sudo apt-get update
      - name: Install LibreOffice, Tesseract, qpdf and fonts
        run: sudo apt-get install --no-install-recommends -y libreoffice-writer libreoffice-calc libreoffice-impress tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara qpdf fonts-noto-core
      - name: Install corpus and Ghostscript-free OCR dependencies
        run: python -m pip install python-docx openpyxl python-pptx pillow "ocrmypdf==17.10.0" "pypdfium2==5.13.0"
      - name: Verify approved Ghostscript-free OCR production path
        run: python scripts/verify-ocr-runtime.py
      - name: Generate safe processing corpus
        run: python scripts/generate-processing-corpus.py
      - name: Start local S3-compatible storage
        run: docker run --detach --name dip-minio --publish 9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
      - name: Start private malware scanner
        run: docker run --detach --name dip-clamd --publish 127.0.0.1:3310:3310 --env CLAMD_CONF_StreamMaxLength=100M clamav/clamav:1.4.3
      - name: Wait for malware scanner readiness
        run: for i in {1..180}; do docker exec dip-clamd clamdscan --ping=1 && exit 0; sleep 2; done; docker logs dip-clamd; exit 1
      - name: Wait for object storage readiness
        run: for i in {1..30}; do curl --fail --silent http://localhost:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - name: Create isolated test bucket
        run: node scripts/ensure-test-bucket.mjs
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dip-test
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
      - name: Bootstrap database roles
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Replay migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Reconcile runtime grants
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Configure ephemeral runtime role
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_processing_runtime'"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
      - name: Verify application dependencies are ready
        run: node scripts/wait-for-dependencies.mjs
        env:
          DATABASE_URL: postgresql://dip_app:dip_processing_runtime@localhost:5432/dip_processing
          REDIS_URL: redis://localhost:6379
      - name: Run Phase 7 workflow closure as least-privilege runtime
        run: node --import ./scripts/node-platform-compat.mjs --import tsx --test test/workflow.execution.e2e.test.ts
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dip-test
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
          DATABASE_URL: postgresql://dip_app:dip_processing_runtime@localhost:5432/dip_processing
          REDIS_URL: redis://localhost:6379
          DIP_RLS_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          RUN_WORKFLOW_E2E: "1"
      - name: Run real processing integrations
        run: npm test
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dip-test
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          REDIS_URL: redis://localhost:6379
          DIP_RLS_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/dip_processing
          DIP_RLS_TEST_DATABASE_URL: postgresql://dip_app:dip_processing_runtime@localhost:5432/dip_processing
          RUN_STORAGE_E2E: "1"
          RUN_PROCESSING_CORPUS: "1"
          FULL_PROCESSING_E2E: "1"
          REDIS_E2E: "1"

  worker-image:
    name: Production worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dedicated document worker
        run: docker build --file Dockerfile.worker --tag dip-document-worker:release-a .
      - name: Verify non-root runtime identity
        run: test "$(docker run --rm --entrypoint id dip-document-worker:release-a -u)" = "10001"
      - name: Verify worker runtime and prohibited dependency gate
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 --tmpfs /tmp/dip:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700 --entrypoint python3 dip-document-worker:release-a -c "from pathlib import Path; from tempfile import TemporaryDirectory; d=TemporaryDirectory(dir='/tmp/dip'); p=Path(d.name)/'probe'; p.write_text('ok'); assert p.read_text() == 'ok'; d.cleanup()"
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 --tmpfs /tmp/dip:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700 --entrypoint python3 dip-document-worker:release-a scripts/verify-ocr-runtime.py
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 --tmpfs /tmp/dip:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700 --entrypoint sh dip-document-worker:release-a -c 'test "$(id -u):$(id -g)" = "10001:10001"; test "$(stat -c %a /tmp)" = "1777"; test "$(stat -c %a /tmp/dip)" = "700"; awk '\''$2 == "/" && $4 ~ /(^|,)ro(,|$)/ { root=1 } $2 == "/tmp" && $4 ~ /size=65536k/ { tmp=1 } $2 == "/tmp/dip" && $4 ~ /size=262144k/ { dip=1 } END { exit !(root && tmp && dip) }'\'' /proc/mounts; soffice -env:UserInstallation=file:///tmp/dip/lo-startup-profile --headless --terminate_after_init'
      - name: Verify qpdf security capabilities in the production worker
        run: |
          mkdir -p "$RUNNER_TEMP/qpdf-sbom"
          chmod 0777 "$RUNNER_TEMP/qpdf-sbom"
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 --tmpfs /tmp/dip:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700 --mount type=bind,source="$RUNNER_TEMP/qpdf-sbom",target=/sbom --env QPDF_SBOM_PATH=/sbom/qpdf-worker.spdx.json --entrypoint node dip-document-worker:release-a scripts/verify-qpdf-security-runtime.mjs
          test -s "$RUNNER_TEMP/qpdf-sbom/qpdf-worker.spdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qpdf-production-worker-sbom
          path: ${{ runner.temp }}/qpdf-sbom/qpdf-worker.spdx.json
          if-no-files-found: error
      - name: Print immutable worker dependency versions
        run: |
          docker run --rm --entrypoint node dip-document-worker:release-a --version
          docker run --rm --entrypoint soffice dip-document-worker:release-a --version
          docker run --rm --entrypoint qpdf dip-document-worker:release-a --version
          docker run --rm --entrypoint tesseract dip-document-worker:release-a --version
      - name: Start private ClamAV scanner
        run: docker run --detach --name dip-clamd --publish 127.0.0.1:3310:3310 --env CLAMD_CONF_StreamMaxLength=100M clamav/clamav:1.4.3
      - name: Wait for ClamAV signatures and clamd readiness
        run: for i in {1..180}; do docker exec dip-clamd clamdscan --ping=1 && exit 0; sleep 2; done; docker logs dip-clamd; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run safe EICAR scanner integration
        run: node --import ./scripts/node-platform-compat.mjs --import tsx --test test/malware-scanning.test.ts
        env:
          CLAMD_E2E: "1"
          CLAMD_HOST: 127.0.0.1
          CLAMD_PORT: "3310"
          PHASE1_SECRET_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  structural-grayscale-stage3c:
    name: Structural Grayscale Stage 3C sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Provision and verify reviewed CMYK ICC fixture
        run: python scripts/experiments/provision-structural-grayscale-stage3c-icc.py
      - name: Install Chromium for independent Arabic fixture generation
        run: npx playwright install --with-deps chromium
      - name: Generate independent Chromium Arabic fixtures
        run: |
          mkdir -p output/pdf/structural-grayscale-stage3a
          mkdir -p output/pdf/structural-grayscale-stage3c-widgets
          node scripts/experiments/structural-grayscale-stage3a-browser.mjs \
            generate output/pdf/structural-grayscale-stage3a
          node scripts/experiments/structural-grayscale-stage3a-browser.mjs \
            generate-stage3c-widgets output/pdf/structural-grayscale-stage3c-widgets
          test -s output/pdf/structural-grayscale-stage3a/arabic-logical-source.pdf
          test -s output/pdf/structural-grayscale-stage3a/arabic-logical-expected.pdf
          test "$(find output/pdf/structural-grayscale-stage3c-widgets -name '*.pdf' | wc -l)" -eq 8
      - name: Execute fail-closed Stage 3C production-sandbox gate
        run: sh scripts/experiments/run-structural-grayscale-stage3b-sandbox.sh
      - name: Publish sanitized Stage 3C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-grayscale-stage3c-evidence
          path: ${{ runner.temp }}/dip-gray-stage3c-output
          if-no-files-found: error
          retention-days: 14

  browser-accessibility:
    name: Browser / Accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_browser
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare authenticated browser database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_browser
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
          npx prisma migrate deploy
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_browser_runtime'"
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="INSERT INTO users (id,email,display_name,locale,status,created_at,updated_at) VALUES ('b0000000-0000-4000-8000-000000000001','release-b-browser@example.invalid','Release B','en','ACTIVE',now(),now())"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dip_browser
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      - run: npm run test:browser
        env:
          DATABASE_URL: postgresql://dip_app:dip_browser_runtime@localhost:5432/dip_browser
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          AUTH_SECRET: release-b-browser-secret
          AUTH_BROWSER_E2E: "1"

  groq-evaluation:
    name: CR-002 Groq evaluation (non-production)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_EVALUATION_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run CR-002 contract and corpus tests
        run: node --import ./scripts/node-platform-compat.mjs --import tsx --test test/ai-gateway.runtime.test.ts test/groq-evaluation.e2e.test.ts
      - name: Verify CR-002 live evaluation configuration
        shell: bash
        run: |
          if test -n "$GROQ_API_KEY"; then echo "GROQ_API_KEY_PRESENT=true"; else echo "GROQ_API_KEY_PRESENT=false"; fi
          if test "$GROQ_EVALUATION_ENABLED" = "1"; then echo "GROQ_EVALUATION_ENABLED=true"; else echo "GROQ_EVALUATION_ENABLED=false"; fi
          test -n "$GROQ_API_KEY" || { echo "CR-002 configuration error: GROQ_API_KEY is missing from this job."; exit 1; }
          test "$GROQ_EVALUATION_ENABLED" = "1" || { echo "CR-002 configuration error: Groq evaluation is disabled."; exit 1; }
          test "$GROQ_MODEL" = "openai/gpt-oss-120b" || { echo "CR-002 configuration error: unexpected Groq evaluation model."; exit 1; }
      - name: Run required live Groq evaluation with independent Gemini comparison when available
        env:
          AI_PROVIDER_EVALUATION_E2E: "1"
        run: node --import ./scripts/node-platform-compat.mjs --import tsx --test test/groq-evaluation.e2e.test.ts

  release-b-e2e:
    name: Full Release B E2E
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dip_release_b
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx prisma generate
      - name: Require protected Groq credential
        run: test -n "$GROQ_API_KEY"
      - name: Verify Release B production AI route
        run: |
          test "$AI_PROVIDER" = "groq"
          test "$GROQ_MODEL" = "openai/gpt-oss-120b"
          echo "Release B resolved production provider/model: groq/openai-gpt-oss-120b"
      - name: Generate safe Office and OCR corpus
        run: |
          python -m pip install python-docx openpyxl python-pptx pillow
          python scripts/generate-processing-corpus.py
      - name: Build the Release A production worker
        run: docker build --file Dockerfile.worker --tag dip-document-worker:release-b .
      - name: Start private storage and malware scanner
        run: |
          docker run --detach --name dip-release-b-minio --network host --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data --address :9000
          docker run --detach --name dip-release-b-clamd --network host --env CLAMD_CONF_StreamMaxLength=100M clamav/clamav:1.4.3
      - name: Wait for private dependencies
        run: |
          for i in {1..180}; do docker exec dip-release-b-clamd clamdscan --ping=1 && break; test "$i" != 180 || exit 1; sleep 2; done
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break; test "$i" != 60 || exit 1; sleep 1; done
      - name: Create object bucket and database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dip_release_b
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: dip-release-b
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_REGION: us-east-1
        run: |
          node scripts/ensure-test-bucket.mjs
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/roles.sql
          npx prisma migrate deploy
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=prisma/bootstrap/dip_app.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="ALTER ROLE dip_app PASSWORD 'dip_release_b_runtime'"
      - name: Start actual production worker image
        run: >-
          docker run --detach --name dip-release-b-worker --network host --read-only
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
          --tmpfs /tmp/dip:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700
          --env DATABASE_URL=postgresql://dip_app:dip_release_b_runtime@127.0.0.1:5432/dip_release_b
          --env REDIS_URL=redis://127.0.0.1:6379
          --env STORAGE_ENDPOINT=http://127.0.0.1:9000 --env STORAGE_BUCKET=dip-release-b
          --env STORAGE_ACCESS_KEY=minioadmin --env STORAGE_SECRET_KEY=minioadmin --env STORAGE_REGION=us-east-1
          --env CLAMD_HOST=127.0.0.1 --env CLAMD_PORT=3310 --env AUTH_SECRET=release-b-ci-only-secret
          --env PHASE1_SECRET_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          --env AI_PROVIDER --env GROQ_API_KEY --env GROQ_MODEL
          dip-document-worker:release-b
      - name: Build and start standalone Public API
        env:
          DATABASE_URL: postgresql://dip_app:dip_release_b_runtime@127.0.0.1:5432/dip_release_b
          REDIS_URL: redis://127.0.0.1:6379
          STORAGE_ENDPOINT: http://127.0.0.1:9000

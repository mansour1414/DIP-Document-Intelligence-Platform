name: Retention Dry-Run

# Preparation-phase workflow: read-only, dry-run only, and INACTIVE by default.
#
# Merging this file does NOT authorise production connectivity. Two independent
# gates must both open before a single production-connected run can happen:
#
#   1. Owner activation: repository variable RETENTION_DRY_RUN_ENABLED must be the
#      exact string "true". It does not exist yet, so the job stops at its first
#      step — before checkout, before any credential is injected, before any
#      socket is opened — even if every database secret is already provisioned.
#   2. The run step itself: `npm run retention:dry-run` refuses apply and has no
#      destructive mode at all.
#
# Apply is not reachable from this file (see docs/cr-005-retention-dry-run-execution.md).
# Activation is a separate, owner-approved operational change; it is documented
# in docs/operations/retention-dry-run-operator-procedure.md §7 and must not be
# performed as part of a code merge.

on:
  # Automatic scheduling is DISABLED during preparation. Re-enabling the cron
  # below is part of the activation procedure (owner-approved, separate change),
  # never a side effect of merging code:
  #
  # schedule:
  #   - cron: "17 2 * * *"
  workflow_dispatch:

# A sweep must never overlap another sweep.
concurrency:
  group: retention-cleanup
  cancel-in-progress: false

# Least privilege: checkout and a read-only sweep only. No write scopes needed.
permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require owner activation
        # Fail-closed operational gate, deliberately the FIRST step: no credential
        # is injected and no dependency is contacted unless the owner has
        # activated this workflow. Absent, empty or any value other than "true"
        # fails the job.
        shell: bash
        env:
          RETENTION_DRY_RUN_ENABLED: ${{ vars.RETENTION_DRY_RUN_ENABLED }}
        run: |
          if [ "$RETENTION_DRY_RUN_ENABLED" != "true" ]; then
            echo "RETENTION_DRY_RUN_ACTIVATED=false"
            echo "Retention dry-run is not activated for this repository; nothing was contacted."
            echo "Activation requires owner approval recorded against CR-005 and the repository variable RETENTION_DRY_RUN_ENABLED=true."
            echo "See docs/operations/retention-dry-run-operator-procedure.md section 7."
            exit 1
          fi
          echo "RETENTION_DRY_RUN_ACTIVATED=true"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Refuse apply mode during dry-run preparation
        shell: bash
        env:
          RETENTION_APPLY: ${{ vars.RETENTION_APPLY }}
        run: |
          # Destructive retention is disabled while the dry-run is being prepared.
          # This check is the outer layer: the entrypoint itself
          # (`npm run retention:dry-run`) also aborts when RETENTION_APPLY=1, and
          # the run step below is never given the variable at all.
          case "$RETENTION_APPLY" in
            ""|0)
              echo "RETENTION_APPLY_ENABLED=false"
              echo "RETENTION_MODE=dry_run"
              ;;
            *)
              echo "Retention apply is disabled during dry-run preparation."
              echo "RETENTION_APPLY is set to a non-dry-run value; unset it (or set it to 0) and re-run."
              exit 1
              ;;
          esac
      - name: Validate dry-run configuration
        shell: bash
        env:
          # Exactly the read-only subset. No storage endpoint and no key pair is
          # injected anywhere in this workflow: a dry-run never constructs an
          # object-storage client, so those values must not be able to leak into
          # the job in the first place.
          RETENTION_DATABASE_URL: ${{ secrets.RETENTION_DATABASE_URL }}
          RETENTION_STORAGE_BUCKET: ${{ secrets.RETENTION_STORAGE_BUCKET }}
        run: |
          failed=0
          for name in RETENTION_DATABASE_URL RETENTION_STORAGE_BUCKET; do
            if test -n "${!name}"; then echo "${name}_PRESENT=true"; else echo "${name}_PRESENT=false"; failed=1; fi
          done
          test "$failed" = 0 || { echo "Retention configuration error: required dry-run credential(s) are missing."; exit 1; }
      - name: Run retention dry-run
        # No RETENTION_APPLY here on purpose: the entrypoint refuses apply, and the
        # variable is not needed to select a mode.
        run: npm run retention:dry-run
        env:
          DATABASE_URL: ${{ secrets.RETENTION_DATABASE_URL }}
          # Storage-scope validation reads provider/bucket from database metadata;
          # no endpoint and no key are required for a read-only sweep.
          STORAGE_BUCKET: ${{ secrets.RETENTION_STORAGE_BUCKET }}

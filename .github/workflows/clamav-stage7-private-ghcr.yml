name: ClamAV Stage 7 Private GHCR Candidate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-stage7-arm64-candidate to authorize this internal candidate run
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: clamav-stage7-private-ghcr
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish private ARM64 candidate and verify by digest
    if: github.event.inputs.confirmation == 'publish-stage7-arm64-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/mansour1414/dip-clamav
      CANDIDATE_TAG: stage7-arm64-candidate
      RUN_TAG: stage7-arm64-candidate-run-${{ github.run_id }}
      EXPECTED_REPOSITORY: mansour1414/DIP-Document-Intelligence-Platform
      EXPECTED_PACKAGE_OWNER: mansour1414
      EXPECTED_PACKAGE_NAME: dip-clamav
      EXPECTED_PACKAGE_TYPE: container
      EXPECTED_IMAGE_SOURCE: https://github.com/mansour1414/DIP-Document-Intelligence-Platform
      PREFLIGHT_REGISTRY_DIGEST: sha256:a3927e07032824899944ea42d42848482a917a1cb9326a229b55eddff9329b7a
      PREFLIGHT_REVISION: 5eae943518c4d504dc30b323c040b325a216815e
      PREFLIGHT_RUN_ID: "37934221552"
      PREFLIGHT_RUN_TAG: stage7-arm64-candidate-run-37934221552
      EVIDENCE_DIR: ${{ github.workspace }}/output/clamav-stage7
      SYFT_VERSION: 1.52.0
      SYFT_LINUX_AMD64_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
      GRYPE_VERSION: 0.119.0
      GRYPE_LINUX_AMD64_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b

    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce repository and manual-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "${{ github.event.inputs.confirmation }}" = publish-stage7-arm64-candidate
          test "$IMAGE_NAME" = ghcr.io/mansour1414/dip-clamav
          case "$CANDIDATE_TAG $RUN_TAG" in
            *latest*|*production*|*prod*)
              echo "Production-like tags are forbidden" >&2
              exit 2
              ;;
          esac
          mkdir -p "$EVIDENCE_DIR"

      - name: Record exact source hashes and workflow identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "commit_sha=$GITHUB_SHA" \
            "workflow_ref=$GITHUB_WORKFLOW_REF" \
            "workflow_sha=$GITHUB_WORKFLOW_SHA" \
            "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "repository=$GITHUB_REPOSITORY" \
            > "$EVIDENCE_DIR/workflow-identity.txt"
          sha256sum \
            .github/workflows/clamav-stage7-private-ghcr.yml \
            docs/operations/experimental/clamav-arm64-stage4-candidate.Dockerfile \
            docs/operations/experimental/clamav-arm64-stage4-candidate.Dockerfile.dockerignore \
            docs/operations/experimental/clamav-arm64-stage4-candidate.conf \
            docs/operations/experimental/clamd-freshness-gate.sh \
            docs/operations/experimental/test-clamd-freshness-gate.sh \
            docs/operations/experimental/run-clamav-stage4-gates.sh \
            docs/operations/experimental/clamav-arm64-stage4-protocol.mts \
            docs/operations/experimental/clamav-arm64-stage4.gate.mts \
            docs/operations/experimental/shim-db.mjs \
            docs/operations/experimental/shim-logging.mjs \
            docs/operations/experimental/shim-metrics.mjs \
            docs/operations/experimental/collect-clamav-stage6-evidence.sh \
            scripts/experiments/analyze-clamav-stage6-closure.mjs \
            scripts/experiments/generate-clamav-stage7-fixtures.py \
            scripts/experiments/verify-ghcr-package-metadata.mjs \
            scripts/experiments/verify-clamav-runtime-isolation.mjs \
            src/lib/malware/clamd.ts \
            src/lib/malware/index.ts \
            src/lib/malware/types.ts \
            Dockerfile.worker package.json package-lock.json \
            > "$EVIDENCE_DIR/source-files.sha256"

      - name: Set up QEMU for ARM64 execution
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to private GHCR with the repository token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the existing private package with independent trust signals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_VERIFY_PHASE: preflight
          GHCR_VERIFY_DIGEST: ${{ env.PREFLIGHT_REGISTRY_DIGEST }}
          GHCR_EXPECTED_SOURCE: ${{ env.EXPECTED_IMAGE_SOURCE }}
          GHCR_EXPECTED_REVISION: ${{ env.PREFLIGHT_REVISION }}
          GHCR_EXPECTED_RUN_ID: ${{ env.PREFLIGHT_RUN_ID }}
          GHCR_EXPECTED_VERSION: ${{ env.PREFLIGHT_RUN_TAG }}
          GHCR_VERIFY_MAX_ATTEMPTS: "12"
          GHCR_VERIFY_RETRY_SECONDS: "5"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/experiments/verify-ghcr-package-metadata.mjs

      - name: Build and publish the ARM64 candidate from source
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docs/operations/experimental/clamav-arm64-stage4-candidate.Dockerfile
          platforms: linux/arm64
          push: true
          no-cache: true
          provenance: mode=max
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.RUN_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/mansour1414/DIP-Document-Intelligence-Platform
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RUN_TAG }}
            io.dip.release-scope=internal-controlled-candidate
            io.dip.workflow-run-id=${{ github.run_id }}

      - name: Record registry index, ARM64 manifest, config, and BuildKit provenance
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_DIGEST"
          case "$PUBLISHED_DIGEST" in sha256:*) ;; *) exit 4 ;; esac
          image_by_digest="$IMAGE_NAME@$PUBLISHED_DIGEST"
          docker buildx imagetools inspect "$image_by_digest" --raw \
            > "$EVIDENCE_DIR/registry-index.json"
          media_type="$(jq -r '.mediaType' "$EVIDENCE_DIR/registry-index.json")"
          if [[ "$media_type" == *image.index* || "$media_type" == *manifest.list* ]]; then
            arm64_manifest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest' "$EVIDENCE_DIR/registry-index.json")"
          else
            arm64_manifest="$PUBLISHED_DIGEST"
          fi
          docker buildx imagetools inspect "$IMAGE_NAME@$arm64_manifest" --raw \
            > "$EVIDENCE_DIR/registry-arm64-manifest.json"
          config_digest="$(jq -er '.config.digest' "$EVIDENCE_DIR/registry-arm64-manifest.json")"
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg tag "$CANDIDATE_TAG" \
            --arg runTag "$RUN_TAG" \
            --arg indexDigest "$PUBLISHED_DIGEST" \
            --arg arm64ManifestDigest "$arm64_manifest" \
            --arg configDigest "$config_digest" \
            --arg platform linux/arm64 \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{image:$image,tags:[$tag,$runTag],registryIndexDigest:$indexDigest,arm64ManifestDigest:$arm64ManifestDigest,imageConfigDigest:$configDigest,platform:$platform,commitSha:$commit,workflowRunId:$runId}' \
            > "$EVIDENCE_DIR/registry-identity.json"
          jq . <<<"$BUILD_METADATA" > "$EVIDENCE_DIR/buildkit-metadata.json"
          {
            echo "IMAGE_BY_DIGEST=$image_by_digest"
            echo "REGISTRY_INDEX_DIGEST=$PUBLISHED_DIGEST"
            echo "ARM64_MANIFEST_DIGEST=$arm64_manifest"
            echo "IMAGE_CONFIG_DIGEST=$config_digest"
          } >> "$GITHUB_ENV"

      - name: Verify the published package with the same independent trust policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_VERIFY_PHASE: post-publish
          GHCR_EXPECTED_SOURCE: ${{ env.EXPECTED_IMAGE_SOURCE }}
          GHCR_EXPECTED_REVISION: ${{ github.sha }}
          GHCR_EXPECTED_RUN_ID: ${{ github.run_id }}
          GHCR_EXPECTED_VERSION: ${{ env.RUN_TAG }}
          GHCR_VERIFY_MAX_ATTEMPTS: "12"
          GHCR_VERIFY_RETRY_SECONDS: "5"
        shell: bash
        run: |
          set -euo pipefail
          export GHCR_VERIFY_DIGEST="$REGISTRY_INDEX_DIGEST"
          node scripts/experiments/verify-ghcr-package-metadata.mjs

      - name: Pull only by immutable registry digest and verify identity
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$IMAGE_NAME:$CANDIDATE_TAG" "$IMAGE_NAME:$RUN_TAG" 2>/dev/null || true
          docker pull --platform linux/arm64 "$IMAGE_BY_DIGEST" \
            | tee "$EVIDENCE_DIR/pull-by-digest.log"
          local_config="$(docker image inspect "$IMAGE_BY_DIGEST" --format '{{.Id}}')"
          test "$local_config" = "$IMAGE_CONFIG_DIGEST"
          test "$(docker image inspect "$IMAGE_BY_DIGEST" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker image inspect "$IMAGE_BY_DIGEST" > "$EVIDENCE_DIR/pulled-image-inspect.json"

      - name: Download and verify fresh ClamAV signature databases
        shell: bash
        run: |
          set -euo pipefail
          db_dir="$RUNNER_TEMP/clamav-stage7-db"
          config_dir="$RUNNER_TEMP/clamav-stage7-freshclam"
          mkdir -p "$db_dir" "$config_dir"
          chmod 0777 "$db_dir"
          cat > "$config_dir/freshclam.conf" <<'EOF'
          DatabaseDirectory /var/lib/clamav
          DatabaseMirror database.clamav.net
          DatabaseOwner clamav
          Checks 24
          LogTime yes
          EOF
          docker run --rm --platform linux/arm64 \
            --entrypoint /usr/bin/freshclam \
            -v "$db_dir:/var/lib/clamav" \
            -v "$config_dir/freshclam.conf:/etc/clamav/freshclam-stage7.conf:ro" \
            "$IMAGE_BY_DIGEST" \
            --config-file=/etc/clamav/freshclam-stage7.conf --stdout
          test -s "$db_dir/main.cvd" || test -s "$db_dir/main.cld"
          test -s "$db_dir/daily.cvd" || test -s "$db_dir/daily.cld"
          echo "CLAMAV_STAGE7_DB=$db_dir" >> "$GITHUB_ENV"

      - name: Run the corrected freshness fixture suite
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DB_DIR="$CLAMAV_STAGE7_DB" \
          FIXTURE_ROOT="$RUNNER_TEMP/clamav-stage7-freshness-fixtures" \
          EVIDENCE_FILE="$EVIDENCE_DIR/freshness-9-of-9.log" \
            bash docs/operations/experimental/test-clamd-freshness-gate.sh "$IMAGE_BY_DIGEST"

      - name: Start the digest-pulled scanner with the reviewed isolation profile
        shell: bash
        run: |
          set -euo pipefail
          docker network create dip-stage7-private
          docker run -d --name clamav-stage7 \
            --platform linux/arm64 \
            --network dip-stage7-private \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 3g --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g,uid=101,gid=102 \
            --tmpfs /run/clamav:rw,noexec,nosuid,size=64m,uid=101,gid=102 \
            --tmpfs /var/log/clamav:rw,noexec,nosuid,size=64m,uid=101,gid=102 \
            -v "$CLAMAV_STAGE7_DB:/var/lib/clamav:ro" \
            "$IMAGE_BY_DIGEST"
          for attempt in $(seq 1 80); do
            health="$(docker inspect clamav-stage7 --format '{{.State.Health.Status}}')"
            [[ "$health" == healthy ]] && break
            if [[ "$health" == unhealthy ]]; then
              docker logs clamav-stage7
              exit 5
            fi
            sleep 3
          done
          test "$(docker inspect clamav-stage7 --format '{{.State.Health.Status}}')" = healthy
          docker inspect clamav-stage7 > "$EVIDENCE_DIR/running-container-inspect.json"
          docker logs clamav-stage7 > "$EVIDENCE_DIR/clamd-runtime.log" 2>&1

      - name: Assert non-root and runtime isolation
        env:
          CLAMAV_CONTAINER_NAME: clamav-stage7
          CLAMAV_IMAGE: ${{ env.IMAGE_BY_DIGEST }}
          CLAMAV_RUNTIME_LOG: ${{ env.EVIDENCE_DIR }}/clamd-runtime.log
        shell: bash
        run: |
          set -euo pipefail
          node scripts/experiments/verify-clamav-runtime-isolation.mjs

      - name: Build the unchanged ARM64 worker test harness
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load \
            -f Dockerfile.worker -t dip-worker:stage7-arm64 .

      - name: Compile the reference fail-closed harness with test-only side-effect shims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7-compiled"
          chmod 0777 "$RUNNER_TEMP/stage7-compiled"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/stage7-compiled:/output" \
            --entrypoint /bin/sh dip-worker:stage7-arm64 -c '
              cd /app
              ./node_modules/.bin/esbuild /workspace/docs/operations/experimental/clamav-arm64-stage4.gate.mts \
                --bundle --platform=node --format=esm \
                --alias:@/lib/db=/workspace/docs/operations/experimental/shim-db.mjs \
                --alias:@/lib/logging=/workspace/docs/operations/experimental/shim-logging.mjs \
                --alias:@/lib/observability/metrics=/workspace/docs/operations/experimental/shim-metrics.mjs \
                --outfile=/output/gate.mjs
            '
          test -s "$RUNNER_TEMP/stage7-compiled/gate.mjs"

      - name: Generate deterministic MaxFiles, MaxRecursion, and bomb fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/experiments/generate-clamav-stage7-fixtures.py \
            --output-dir "$RUNNER_TEMP/stage7-payloads" \
            | tee "$EVIDENCE_DIR/payload-fixture-inventory.txt"
          sha256sum "$RUNNER_TEMP/stage7-payloads"/* \
            > "$EVIDENCE_DIR/payload-fixtures.sha256"

      - name: Run Protocol 20/20 against the digest-pulled image
        shell: bash
        run: |
          set -euo pipefail
          CLAMAV_CONTAINER_NAME=clamav-stage7 \
            bash docs/operations/experimental/run-clamav-stage4-gates.sh \
            docker run --rm --platform linux/arm64 \
              --network dip-stage7-private \
              -e CLAMD_HOST=clamav-stage7 \
              -e PAYLOAD_DIR=/payloads \
              -v "$RUNNER_TEMP/stage7-payloads:/payloads:ro" \
              -v "$GITHUB_WORKSPACE/docs/operations/experimental:/app/docs/operations/experimental:ro" \
              dip-worker:stage7-arm64 node --import tsx /app/docs/operations/experimental/clamav-arm64-stage4-protocol.mts \
            | tee "$EVIDENCE_DIR/protocol-20-of-20.log"
          grep -Fq '### FAILURES=0' "$EVIDENCE_DIR/protocol-20-of-20.log"

      - name: Run Fail-Closed 12/12 against the digest-pulled image
        shell: bash
        run: |
          set -euo pipefail
          CLAMAV_CONTAINER_NAME=clamav-stage7 \
            bash docs/operations/experimental/run-clamav-stage4-gates.sh \
            docker run --rm --platform linux/arm64 \
              --network dip-stage7-private \
              -e CLAMD_HOST=clamav-stage7 \
              -v "$RUNNER_TEMP/stage7-compiled:/evidence:ro" \
              dip-worker:stage7-arm64 node /evidence/gate.mjs \
            | tee "$EVIDENCE_DIR/fail-closed-12-of-12.log"
          grep -Fq '### FAILURES=0' "$EVIDENCE_DIR/fail-closed-12-of-12.log"
          grep -Fq 'only CLEAN reaches storage.put | reached=3 (expected 3)' \
            "$EVIDENCE_DIR/fail-closed-12-of-12.log"

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anchore-tools" "$HOME/.local/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/anchore-tools/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/anchore-tools/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/anchore-tools/syft.tar.gz" -C "$HOME/.local/bin" syft
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/anchore-tools/grype.tar.gz"
          echo "${GRYPE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/anchore-tools/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/anchore-tools/grype.tar.gz" -C "$HOME/.local/bin" grype
          syft version > "$EVIDENCE_DIR/syft-version.txt"
          grype version > "$EVIDENCE_DIR/grype-version.txt"

      - name: Generate digest-bound SPDX, CycloneDX, and CVE evidence
        shell: bash
        run: |
          set -euo pipefail
          syft "registry:$IMAGE_BY_DIGEST" --source-name "$IMAGE_BY_DIGEST" \
            -o "spdx-json=$EVIDENCE_DIR/stage7.spdx.json" \
            -o "cyclonedx-json=$EVIDENCE_DIR/stage7.cdx.json"
          grype "registry:$IMAGE_BY_DIGEST" -o json \
            --file "$EVIDENCE_DIR/stage7.grype.json"
          test "$(jq '.ignoredMatches | length' "$EVIDENCE_DIR/stage7.grype.json")" = 0
          jq -e '.descriptor.db.status.valid == true' "$EVIDENCE_DIR/stage7.grype.json"

      - name: Collect transitive license, notices, and runtime linkage evidence
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_BY_DIGEST" OUT="$EVIDENCE_DIR" \
            bash docs/operations/experimental/collect-clamav-stage6-evidence.sh

      - name: Classify every Stage 7 finding without blanket VEX
        shell: bash
        run: |
          set -euo pipefail
          local_image_id="$(docker image inspect "$IMAGE_BY_DIGEST" --format '{{.Id}}')"
          OUTPUT_DIR="$EVIDENCE_DIR" \
          OUTPUT_PREFIX=stage7 \
          GRYPE_PATH="$EVIDENCE_DIR/stage7.grype.json" \
          LINKAGE_PATH="$EVIDENCE_DIR/clamd-runtime-linkage.txt" \
          LICENSES_PATH="$EVIDENCE_DIR/package-license-inventory.tsv" \
          LOCAL_IMAGE_ID="$local_image_id" \
          REGISTRY_DIGEST="$REGISTRY_INDEX_DIGEST" \
            node scripts/experiments/analyze-clamav-stage6-closure.mjs \
            | tee "$EVIDENCE_DIR/stage7-closure-summary.stdout.json"
          test "$(jq -r '.security.blanketVexIssued' "$EVIDENCE_DIR/stage7-closure-summary.json")" = false
          test "$(jq -r '.security.accept' "$EVIDENCE_DIR/stage7-closure-summary.json")" = 0

      - name: Bind scanner and registry provenance to the evidence set
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile identity "$EVIDENCE_DIR/registry-identity.json" \
            --arg syftVersion "$SYFT_VERSION" \
            --arg grypeVersion "$GRYPE_VERSION" \
            --arg grypeDbSchema "$(jq -r '.descriptor.db.status.schemaVersion' "$EVIDENCE_DIR/stage7.grype.json")" \
            --arg grypeDbBuilt "$(jq -r '.descriptor.db.status.built' "$EVIDENCE_DIR/stage7.grype.json")" \
            --arg grypeDbSource "$(jq -r '.descriptor.db.status.from' "$EVIDENCE_DIR/stage7.grype.json")" \
            --argjson ignored "$(jq '.ignoredMatches | length' "$EVIDENCE_DIR/stage7.grype.json")" \
            '{registry:$identity[0],syft:{version:$syftVersion},grype:{version:$grypeVersion,dbSchema:$grypeDbSchema,dbBuilt:$grypeDbBuilt,dbSource:$grypeDbSource,ignoredFindings:$ignored}}' \
            > "$EVIDENCE_DIR/scan-provenance.json"
          sha256sum \
            "$EVIDENCE_DIR/stage7.spdx.json" \
            "$EVIDENCE_DIR/stage7.cdx.json" \
            "$EVIDENCE_DIR/stage7.grype.json" \
            > "$EVIDENCE_DIR/scanner-evidence.sha256"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name artifact-files.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/artifact-files.sha256"

      - name: Upload Stage 7 immutable-digest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clamav-stage7-ghcr-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary test containers and network
        if: always()
        shell: bash
        run: |
          docker rm -f clamav-stage7 clamav-stage6-extract 2>/dev/null || true
          docker network rm dip-stage7-private 2>/dev/null || true

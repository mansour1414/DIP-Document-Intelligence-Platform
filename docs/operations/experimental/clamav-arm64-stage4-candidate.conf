# ClamAV 1.5.4 candidate configuration for DIP ARM64 (Stage 4)
#
# Every directive below was empirically validated against the ClamAV 1.5.4 parser on
# linux/arm64 (see docs/operations/oci-arm64-stage4-clamav-security-licensing-evidence.md,
# "Directive validation matrix"). Directives that 1.5.4 REJECTS are deliberately absent:
#   MaxRecursionLevel, MaxScanPartitions, MaxDirRecursion, MaxHtmlNotations, MaxCPU,
#   AlertBroken, BytecodeSecurity (1.5.4 rejects every BytecodeSecurity value).
#
# Sizing rationale is measurement-based, not assumed.

TCPSocket 3310
TCPAddr 0.0.0.0

# --- Size limits -------------------------------------------------------------------
# operator-runbook.md:20 requires StreamMaxLength >= the application scan maximum
# (100 MiB baseline). DIP's MALWARE_SCAN_MAX_BYTES is 100 * 1024 * 1024.
# 110M gives 10 MiB of headroom so a payload of exactly 104857600 bytes is never
# rejected on a boundary condition. This does NOT raise DIP's own upload ceiling.
StreamMaxLength 110M

MaxFileSize 110M

# Decompression budget for container formats (DOCX/XLSX/PPTX are ZIP; PDFs embed streams).
# Measured: 420M decompressed costs 16.09s, so 400M is the largest value that still fits
# the scan budget below. See the decompression-bomb measurement in the Stage 4 report.
MaxScanSize 400M

# --- Time budget -------------------------------------------------------------------
# DIP MALWARE_SCAN_TIMEOUT_MS = 30000. Measured 100 MiB INSTREAM latency is 1.68s, so the
# ceiling is reachable well inside 30s. clamd is set BELOW the client timeout so the
# daemon returns a deterministic scan error before the client aborts, instead of leaving
# the outcome to a client-side race.
MaxScanTime 25000
ReadTimeout 120

# --- Concurrency / resource bounds -------------------------------------------------
# 12 threads sized for the 2-CPU Release B baseline; clamd is also capped by the
# container's --cpus/--memory/--pids-limit, so this bounds in-process fan-out, not total.
MaxThreads 12

# --- Archive traversal bounds -------------------------------------------------------
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
MaxIconsPE 100
MaxRecHWP3 16
MaxPartitions 50
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 100M

# --- MANDATORY security control -----------------------------------------------------
# Without this, ClamAV SILENTLY truncates a scan at a limit and still returns a clean
# verdict. Measured bypass on 1.5.4: a ZIP with 10005 benign entries followed by EICAR
# returned "stream: OK" with AlertExceedsMax unset. With AlertExceedsMax yes the same
# payload returns "stream: Heuristics.Limits.Exceeded.MaxFiles FOUND", and a 20-level
# nested archive returns "stream: Heuristics.Limits.Exceeded.MaxRecursion FOUND".
# This turns every limit truncation into a fail-closed detection, which DIP maps to
# SCAN_INFECTED and blocks the upload. Do not set this to no.
AlertExceedsMax yes

# --- Freshness / determinism -------------------------------------------------------
# Per operator-runbook.md:10,20 signatures must be healthy before traffic is accepted.
# The entrypoint refuses to start without a signature database, and freshclam reloads
# clamd on update.
ConcurrentDatabaseReload no
AlertEncrypted no
SelfCheck 3600

# --- Logging -----------------------------------------------------------------------
LogTime yes
LogClean no
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 10M

# --- Paths -------------------------------------------------------------------------
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /run/clamav/clamd.pid
